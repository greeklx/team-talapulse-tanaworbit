<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0b1019" />
    <meta
      name="description"
      content="TanawOrbit is an educational mission-health console with fictional crew profiles and synthetic measurements. It is not a medical device."
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; frame-src 'self' https://www.canva.com https://canva.com https://*.canva.com; connect-src 'self' https://api.tanaw-orbit.app https://tanaworbit-api.robotics8051.workers.dev https://cloudflareinsights.com http://127.0.0.1:8787; base-uri 'self'; form-action 'self';"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <title>TanawOrbit | Mission Health Operations</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("tanaworbit_theme");
          if (t === "light") {
            document.documentElement.setAttribute("data-theme", "light");
          } else {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
